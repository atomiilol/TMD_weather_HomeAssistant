[project]
name = "tmd-weather-homeassistant"
version = "0.5.0b3"
description = "Thai Meteorological Department weather custom integration"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component==0.13.372",
  "ruff==0.17.0",
  "mypy==2.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers --disable-socket --allow-unix-socket"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]

[tool.mypy]
python_version = "3.14"
strict = true
follow_imports = "silent"
files = ["custom_components/tmd_weather"]

[tool.coverage.run]
source = ["custom_components/tmd_weather"]
branch = true

[tool.coverage.report]
show_missing = true
