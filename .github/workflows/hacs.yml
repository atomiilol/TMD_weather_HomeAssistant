name: HACS validation

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate integration with HACS
        uses: hacs/action@main
        with:
          category: integration
          comment: false
