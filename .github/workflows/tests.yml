name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install uv
        run: python -m pip install uv==0.12.23
      - name: Install locked dependencies
        run: uv sync --frozen --group dev
      - name: Lint
        run: uv run --frozen ruff check custom_components tests script
      - name: Format
        run: uv run --frozen ruff format --check custom_components tests script
      - name: Type check
        run: uv run --frozen mypy custom_components/tmd_weather script/check_release.py
      - name: Verify packaging and version
        run: uv run --frozen python script/check_release.py
      - name: Test
        run: uv run --frozen pytest tests/components/tmd_weather --cov --cov-report=term-missing
