name: Publish GitHub release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Require tag, manifest, project and changelog agreement
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$RELEASE_REF_TYPE" != tag ]; then
            echo 'Select a version tag when running this workflow manually.'
            exit 1
          fi
          python script/check_release.py --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

  tests:
    needs: version
    uses: ./.github/workflows/tests.yml

  hacs:
    needs: version
    uses: ./.github/workflows/hacs.yml

  hassfest:
    needs: version
    uses: ./.github/workflows/hassfest.yml

  publish:
    needs: [version, tests, hacs, hassfest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Generate notes for the tagged version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python script/check_release.py --tag "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/tmd-release-notes.md"
      - name: Publish the release for HACS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          # A retry must not overwrite an already published release.
          if gh release view "$RELEASE_TAG" --json isDraft,isPrerelease \
            --jq '"\(.isDraft) \(.isPrerelease)"' > "$RUNNER_TEMP/tmd-release-status"; then
            if [ "$(cat "$RUNNER_TEMP/tmd-release-status")" != "false $PRERELEASE" ]; then
              echo 'Existing release status differs from the validated version.'
              exit 1
            fi
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi
          if [ "$PRERELEASE" = true ]; then
            gh release create "$RELEASE_TAG" --verify-tag --prerelease --latest=false \
              --title "$RELEASE_TAG (AWS stations beta)" --notes-file "$RUNNER_TEMP/tmd-release-notes.md"
          else
            gh release create "$RELEASE_TAG" --verify-tag --latest \
              --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/tmd-release-notes.md"
          fi
