name: Release version validation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to validate, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Require tag, manifest, project and changelog agreement
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python script/check_release.py --tag "$RELEASE_TAG"
